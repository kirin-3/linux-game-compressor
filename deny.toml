[graph]
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
ignore = [
    # egui font rasterizer; no compatible alternative; unmaintained notice, not a vulnerability.
    "RUSTSEC-2026-0192",
]

[licenses]
# First-party crates have no license selected yet. Audit their dependencies.
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
]

[[licenses.exceptions]]
allow = ["OFL-1.1", "Ubuntu-font-1.0"]
crate = "epaint_default_fonts"
