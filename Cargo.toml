[workspace]
resolver = "2"
members = ["crates/gui", "crates/app", "crates/core", "crates/media", "crates/engine-renpy", "crates/engine-godot", "crates/engine-rpgm", "crates/engine-unity", "crates/cli", "crates/test-fixtures"]

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-only"
repository = "https://github.com/kirin-3/linux-game-compressor"

[workspace.dependencies]
eframe = { version = "0.32.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_extras = "=0.32.3"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal", "wayland"] }
directories = "6"
compressor-app = { path = "crates/app" }
compressor-core = { path = "crates/core" }
compressor-media = { path = "crates/media" }
compressor-engine-renpy = { path = "crates/engine-renpy" }
compressor-engine-godot = { path = "crates/engine-godot" }
compressor-engine-rpgm = { path = "crates/engine-rpgm" }
compressor-engine-unity = { path = "crates/engine-unity" }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio-util = "0.7"
blake3 = "1"
rayon = "1"
walkdir = "2"
toml = "0.8"
tokio = { version = "1", features = ["process", "io-util", "fs", "time", "macros", "rt-multi-thread", "sync", "signal"] }
libc = "0.2"
reflink-copy = "0.1"
filetime = "0.2"
pathdiff = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
regex = "1"
clap = { version = "4", features = ["derive"] }
indicatif = "0.18"
