name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # Oldest supported runner, so the binaries run on older glibc versions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libgl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p compressor-gui
      - name: Package
        run: |
          mkdir dist
          cp target/release/linux-game-compressor dist/
          strip dist/linux-game-compressor
          (cd dist && sha256sum linux-game-compressor > linux-game-compressor.sha256)
      - uses: actions/upload-artifact@v5
        with:
          name: linux-game-compressor-x86_64-linux
          path: dist/
          retention-days: 1
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Linux Game Compressor ${GITHUB_REF_NAME#v}" \
            --generate-notes
