name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # Oldest supported runner, so the binaries run on older glibc versions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libgl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p compressor-cli -p compressor-gui
      - name: Package
        id: package
        run: |
          version=${GITHUB_REF_NAME#v}
          [ "$GITHUB_REF_TYPE" = tag ] || version=dev-${GITHUB_SHA::7}
          name=linux-game-compressor-$version-x86_64-linux
          dir=dist/$name
          mkdir -p "$dir/bin"
          cp target/release/compressor target/release/compressor-gui "$dir/bin/"
          strip "$dir/bin/"*
          install -Dm644 packaging/linux-game-compressor.desktop \
            "$dir/share/applications/linux-game-compressor.desktop"
          install -Dm644 crates/gui/assets/icon-256.png \
            "$dir/share/icons/hicolor/256x256/apps/linux-game-compressor.png"
          install -m755 packaging/install.sh "$dir/install.sh"
          cp README.md LICENSE THIRD_PARTY.md "$dir/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          retention-days: 1
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Linux Game Compressor ${GITHUB_REF_NAME#v}" \
            --generate-notes
